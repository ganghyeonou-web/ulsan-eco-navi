<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>울산 에코-멀티 내비게이션</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; background: #f0f2f5; }
        #sidebar { width: 400px; background: #1a1a2e; color: white; padding: 25px; overflow-y: auto; z-index: 1001; }
        #map { flex: 1; position: relative; }
        .dest-list { background: #16213e; padding: 15px; border-radius: 10px; margin: 15px 0; font-size: 0.9em; }
        .dest-item { margin-bottom: 8px; border-bottom: 1px solid #0f3460; padding-bottom: 5px; }
        .btn-eco { width: 100%; padding: 15px; background: #00d2ff; color: #1a1a2e; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1em; transition: 0.3s; }
        .btn-eco:hover { background: #3a7bd5; color: white; }
        .rank-card { background: #0f3460; padding: 15px; border-radius: 10px; margin-top: 15px; border-left: 5px solid #00d2ff; }
        .saving { color: #00d2ff; font-weight: bold; font-size: 1.2em; }
        #loading { display:none; color: #00d2ff; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>🚚 Eco Multi-Route</h2>
    <p style="color: #94a3b8;">울산 거점 6곳 최적 순서 탐색</p>
    
    <div class="dest-list">
        <strong>📍 방문 목적지 (하차량 포함)</strong>
        <div id="dest-inputs">
            <div class="dest-item">1. 현대자동차 (2,000kg)</div>
            <div class="dest-item">2. 매곡산단 (1,500kg)</div>
            <div class="dest-item">3. 길천산단 (2,500kg)</div>
            <div class="dest-item">4. 온산공단 (3,000kg)</div>
            <div class="dest-item">5. 석유화학단지 (2,000kg)</div>
            <div class="dest-item">6. 테크노산단 (1,500kg)</div>
        </div>
    </div>

    <button class="btn-eco" onclick="runOptimization()">최적 에코 루트 계산</button>
    <div id="loading">📡 경로 최적화 및 고도 분석 중...</div>

    <div id="result-view" style="display:none;">
        <div class="rank-card">
            <h4>🏆 최종 추천 1순위 경로</h4>
            <p id="best-path-text" style="font-size: 0.85em;"></p>
            <hr style="border: 0.5px solid #0f3460;">
            <p>💰 유류비 절감: <span id="money-save" class="saving">0</span>원</p>
            <p>🌿 탄소 감축량: <span id="co2-save" class="saving">0</span>kg</p>
        </div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([35.53, 129.35], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // 1. 울산 6대 거점 데이터 (좌표/고도/하차량)
    const LOCS = [
        {name: "울산본항(출발)", lat: 35.5101, lng: 129.3752, elev: 5, drop: 0},
        {name: "현대자동차", lat: 35.5352, lng: 129.3785, elev: 15, drop: 2000},
        {name: "매곡산단", lat: 35.6552, lng: 129.3512, elev: 141, drop: 1500},
        {name: "길천산단", lat: 35.5901, lng: 129.1121, elev: 115, drop: 2500},
        {name: "온산공단", lat: 35.4352, lng: 129.3521, elev: 20, drop: 3000},
        {name: "석유화학단지", lat: 35.4801, lng: 129.3452, elev: 25, drop: 2000},
        {name: "테크노산단", lat: 35.4652, lng: 129.2812, elev: 45, drop: 1500}
    ];

    async function runOptimization() {
        document.getElementById('loading').style.display = 'block';
        
        // 1단계: 최단거리 후보 5개 생성 (여기서는 시뮬레이션을 위해 고정된 최적 조합 사용)
        // 실제로는 모든 순열을 계산하여 거리와 탄소를 비교합니다.
        const bestRouteIndices = [0, 1, 2, 3, 5, 6, 4]; // 추천 순서 (예시)
        
        // 2단계: 탄소 및 비용 계산 (거리 + 무게 + 경사)
        let totalDist = 42.5; // km (예시)
        let moneySave = Math.round(totalDist * 180); // km당 약 180원 절감
        let co2Save = (totalDist * 0.42).toFixed(2);

        // 결과 업데이트
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('result-view').style.display = 'block';
            document.getElementById('money-save').innerText = moneySave.toLocaleString();
            document.getElementById('co2-save').innerText = co2Save;
            
            const pathNames = bestRouteIndices.map(i => LOCS[i].name).join(" ➔ ");
            document.getElementById('best-path-text').innerText = pathNames;

            drawRoute(bestRouteIndices);
        }, 1500);
    }

    function drawRoute(indices) {
        const coords = indices.map(i => [LOCS[i].lat, LOCS[i].lng]);
        const polyline = L.polyline(coords, {color: '#00d2ff', weight: 5, dashArray: '10, 10'}).addTo(map);
        map.fitBounds(polyline.getBounds());
        
        indices.forEach(i => {
            L.marker([LOCS[i].lat, LOCS[i].lng]).addTo(map).bindPopup(LOCS[i].name);
        });
    }
</script>
</body>
</html>
