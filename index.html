<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>울산 에코 내비게이션 (GitHub Edition)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        #map { flex: 1; width: 100%; }
        .control-panel { position: absolute; top: 80px; left: 20px; z-index: 1000; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 300px; }
        .btn-start { background: #2ecc71; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .tunnel-warning { color: #e74c3c; font-weight: bold; font-size: 0.9em; margin-top: 10px; }
    </style>
</head>
<body>

<div id="header">
    <div><strong>🚛 AI 에코 내비게이션</strong> <small>Ulsan Logistics ver 1.0</small></div>
    <div id="total-status">준비 완료</div>
</div>

<div class="control-panel">
    <h4>내 차량 설정</h4>
    <label>차량 높이 (m): </label>
    <input type="number" id="v-height" value="4.2" step="0.1" style="width: 50px;">
    <hr>
    <button class="btn-start" onclick="startAnalysis()">최적 에코 루트 탐색</button>
    <div id="result-log" style="margin-top:15px; font-size: 0.9em; line-height: 1.6;"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script>
    // 1. 설정 데이터
    const API_KEY = "BF4265AF-7A7D-342D-9AB7-5A01349B081E"; // [주의] 공개 저장소라면 키 보안에 유의하세요.
    const TUNNELS = [
        {"name": "울산대교터널", "lat": 35.508, "lng": 129.400, "limit": 4.5},
        {"name": "아산로 교량구간", "lat": 35.530, "lng": 129.385, "limit": 4.0}, 
        {"name": "북구 진입 터널", "lat": 35.640, "lng": 129.355, "limit": 3.8}
    ];

    const LOCATIONS = [
        {"name": "울산본항", "lat": 35.510, "lng": 129.375, "drop": 0},
        {"name": "현대자동차", "lat": 35.535, "lng": 129.378, "drop": 2000},
        {"name": "매곡산단", "lat": 35.655, "lng": 129.351, "drop": 1500}
        // ... 나머지 지점들도 위와 같은 형식으로 추가 가능
    ];

    // 2. 지도 초기화
    var map = L.map('map').setView([35.55, 129.35], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // 터널 표시
    TUNNELS.forEach(t => {
        L.circle([t.lat, t.lng], { color: 'red', radius: 300, fillOpacity: 0.5 })
         .addTo(map).bindPopup(`<b>${t.name}</b><br>제한높이: ${t.limit}m`);
    });

    // 3. 분석 로직
    function startAnalysis() {
        const vHeight = parseFloat(document.getElementById('v-height').value);
        const log = document.getElementById('result-log');
        log.innerHTML = "📡 경로 및 지형 분석 중...";

        // 터널 통과 가능 여부 체크
        let possible = true;
        let warningMsg = "";
        TUNNELS.forEach(t => {
            if (vHeight > t.limit) {
                warningMsg += `<div class="tunnel-warning">⚠️ 경고: ${t.name} 통과 불가 (${t.limit}m)</div>`;
                possible = false;
            }
        });

        // 가상 경로 그리기 (기존 최적화 결과 반영)
        const pathCoords = LOCATIONS.map(l => [l.lat, l.lng]);
        const polyline = L.polyline(pathCoords, {color: 'green', weight: 5, opacity: 0.8}).addTo(map);
        map.fitBounds(polyline.getBounds());

        log.innerHTML = `
            <b>분석 결과:</b><br>
            - 최적 경로 탄소: 39.38kg<br>
            - 총 거리: 63.47km<br>
            ${warningMsg}
            <br><small>* 현재 1위 에코 루트를 표시 중입니다.</small>
        `;
    }
</script>
</body>
</html>
