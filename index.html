<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>울산 지능형 에코 내비게이션</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Malgun Gothic', sans-serif; display: flex; height: 100vh; background: #f4f7f6; }
        #sidebar { width: 350px; background: #2c3e50; color: white; padding: 20px; overflow-y: auto; z-index: 1001; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
        #map { flex: 1; position: relative; }
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 8px; border-radius: 4px; border: none; margin-top: 5px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        .btn-primary { background: #2ecc71; color: white; }
        .btn-primary:hover { background: #27ae60; }
        .result-card { background: #34495e; padding: 15px; border-radius: 8px; margin-top: 20px; border-left: 5px solid #2ecc71; }
        .saving-highlight { color: #f1c40f; font-size: 1.2em; font-weight: bold; }
        #simulation-stats { position: absolute; bottom: 20px; right: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 10px; z-index: 1000; display: none; border: 2px solid #2ecc71; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>🌿 Eco Master</h2>
    <p><small>차량 높이 및 목적지를 설정하세요.</small></p>
    
    <div class="input-group">
        <label>🚚 차량 높이 (m)</label>
        <input type="number" id="truck-height" value="4.2" step="0.1">
    </div>
    
    <div class="input-group">
        <label>📍 출발지 (울산 내 주소)</label>
        <input type="text" id="start-addr" value="울산 남구 장생포고래로 271">
    </div>

    <div class="input-group">
        <label>📍 목적지 (울산 내 주소)</label>
        <input type="text" id="end-addr" value="울산 북구 매곡산업로 21">
    </div>

    <button class="btn btn-primary" onclick="startNavi()">에코 경로 탐색 및 주행</button>

    <div id="results" style="display:none;">
        <div class="result-card">
            <h4>💰 절감 분석 결과</h4>
            <p>탄소 절감: <span id="carbon-save" class="saving-highlight">0</span> kg</p>
            <p>기름값 절약: <span id="money-save" class="saving-highlight">0</span> 원</p>
            <p><small>* 일반 경로 대비 최적화 결과</small></p>
        </div>
    </div>
</div>

<div id="map">
    <div id="simulation-stats">
        <strong>🚛 실시간 주행 정보</strong><br>
        현재 무게: <span id="live-weight">0</span> kg<br>
        현재 고도: <span id="live-elev">0</span> m
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script>
    let map = L.map('map').setView([35.55, 129.35], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let truckMarker;

    async function startNavi() {
        // 1. 주소 -> 좌표 변환 (VWorld API 연동 부분 - 시뮬레이션을 위해 고정값 예시)
        const start = [35.510, 129.375]; // 울산본항
        const end = [35.655, 129.351];   // 매곡산단

        // 2. OSRM 실제 경로 데이터 가져오기
        const response = await fetch(`https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`);
        const data = await response.json();
        const route = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);

        // 3. 경로 그리기
        L.polyline(route, {color: '#2ecc71', weight: 6}).addTo(map);
        map.fitBounds(L.polyline(route).getBounds());

        // 4. 비용 절감 계산 로직
        const distance = data.routes[0].distance / 1000; // km
        calculateSavings(distance);

        // 5. 차량 시뮬레이션 시작
        runSimulation(route);
    }

    function calculateSavings(dist) {
        // 로직: 일반 경로는 경사를 고려 안해서 연비가 나쁨(5km/L), 에코 경로는 최적화(7km/L)
        // 경유 가격 1,500원 기준
        const fuelPrice = 1500;
        const standardFuel = dist / 5;
        const ecoFuel = dist / 7;
        
        const moneySaved = Math.round((standardFuel - ecoFuel) * fuelPrice);
        const carbonSaved = (dist * 0.25 * 0.15).toFixed(2); // 대략적인 15% 절감치

        document.getElementById('results').style.display = 'block';
        document.getElementById('carbon-save').innerText = carbonSaved;
        document.getElementById('money-save').innerText = moneySaved.toLocaleString();
    }

    function runSimulation(path) {
        if (truckMarker) map.removeLayer(truckMarker);
        document.getElementById('simulation-stats').style.display = 'block';
        
        truckMarker = L.marker(path[0], {
            icon: L.divIcon({html: '🚛', className: 'truck-icon', iconSize: [30, 30]})
        }).addTo(map);

        let i = 0;
        const timer = setInterval(() => {
            if (i >= path.length) {
                clearInterval(timer);
                alert("목적지에 도착했습니다! 탄소 절감에 기여하셨습니다.");
                return;
            }
            truckMarker.setLatLng(path[i]);
            document.getElementById('live-weight').innerText = 10000 - (i * 50); // 주행 중 소모/하차 시뮬레이션
            i++;
        }, 100);
    }
</script>
</body>
</html>
