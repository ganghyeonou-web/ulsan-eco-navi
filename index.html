<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>울산 에코 내비게이션 (Ultimate Mode)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; overflow: hidden; background: #e9ecef; }
        #map { height: 100vh; width: 100vw; z-index: 1; }

        /* --- 설정 화면 --- */
        #setup-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(26, 38, 57, 0.95); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .setup-box { background: white; width: 90%; max-width: 550px; padding: 30px; border-radius: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }
        .setup-box h2 { margin-top: 0; color: #1a3673; }
        .input-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
        .input-row input, .input-row select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        .input-row input[type="text"] { flex: 2; }
        .input-row input[type="number"] { flex: 1; }
        .btn-add { background: #f1c40f; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .route-select { width: 100%; padding: 12px; margin-top: 15px; font-weight: bold; background: #f1f2f6; border-radius: 8px; border: 2px solid #2e86de; }
        .btn-start { width: 100%; padding: 15px; background: #2e86de; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        /* --- TBT 패널 --- */
        #top-navi-panel { position: absolute; top: 20px; left: 20px; z-index: 1000; background: #1a3673; color: white; width: 340px; border-radius: 12px; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .direction-box { padding: 20px; display: flex; align-items: center; border-bottom: 1px solid #2c4c94; }
        .turn-arrow { font-size: 50px; margin-right: 20px; color: #00d2ff; font-weight: 900; }
        .dist-text { font-size: 40px; font-weight: bold; letter-spacing: -1px; }
        .dist-unit { font-size: 20px; font-weight: normal; }
        .road-name { padding: 15px 20px; font-size: 20px; font-weight: bold; background: #142a5c; }
        
        /* --- 교통상황 범례 --- */
        #traffic-legend { position: absolute; top: 200px; left: 20px; z-index: 1000; display: none; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .leg-item { display: flex; align-items: center; margin-bottom: 5px; }
        .leg-color { width: 15px; height: 15px; border-radius: 50%; margin-right: 8px; }

        /* --- 우측 배속 및 에코 패널 --- */
        #right-panel { position: absolute; top: 20px; right: 20px; z-index: 1000; display: none; flex-direction: column; gap: 15px; align-items: flex-end; }
        .speed-controls { display: flex; gap: 5px; background: rgba(255,255,255,0.9); padding: 8px; border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .speed-btn { border: none; background: #f1f3f5; padding: 10px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s;}
        .speed-btn.active { background: #ff4757; color: white; }
        .eco-stats { background: rgba(255,255,255,0.95); padding: 15px 20px; border-radius: 12px; border-left: 5px solid #2ed573; text-align: right; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .eco-val { color: #2ed573; font-size: 22px; font-weight:bold; }
        .eco-reference { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ccc; font-size: 11px; color: #7f8fa6; text-align: right; line-height: 1.4; }

        /* --- 하단 상태 패널 --- */
        #bottom-panel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; background: white; width: 90%; max-width: 650px; border-radius: 16px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3); justify-content: space-around; padding: 20px; align-items: center; }
        .info-block { text-align: center; }
        .info-val { font-size: 26px; font-weight: 800; color: #2f3640; }
        .info-label { font-size: 13px; color: #7f8fa6; font-weight: 600; margin-top: 5px; }

        /* 알림 팝업 */
        #tbt-alert { position: absolute; top: 220px; left: 50%; transform: translateX(-50%); background: rgba(255, 71, 87, 0.95); color: white; padding: 15px 30px; border-radius: 30px; font-size: 22px; font-weight: bold; z-index: 2000; opacity: 0; transition: opacity 0.2s; pointer-events: none; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        #arrival-toast { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(39, 174, 96, 0.95); color: white; padding: 25px 40px; border-radius: 15px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.5); z-index: 3000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .navi-arrow { width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 50px solid #ff4757; filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.5)); transform-origin: 50% 100%; transition: transform 0.1s linear; }
    </style>
</head>
<body>

    <div id="arrival-toast">
        <div style="font-size:28px; font-weight:bold; margin-bottom:10px;" id="toast-title">🚩 목적지 도착</div>
        <div style="font-size:18px;" id="toast-desc">하차 완료</div>
    </div>
    <div id="tbt-alert">⚠️ 잠시 후 우회전입니다.</div>

    <div id="setup-screen">
        <div class="setup-box">
            <h2>🚚 에코 내비게이션 설정</h2>
            
            <div style="display:flex; gap:10px; align-items: center; margin-bottom:15px;">
                <div style="flex:1; font-weight:bold;">출발지</div>
                <input type="text" id="start-loc" value="울산대학교 정문" style="flex:2; padding:10px; border-radius:5px; border:1px solid #ccc;">
            </div>

            <div style="display:flex; gap:10px; align-items: center; margin-bottom:15px; background:#f1f2f6; padding:10px; border-radius:8px;">
                <div style="flex:1; font-weight:bold; color:#1a3673;">기본 주행 속력</div>
                <input type="number" id="base-speed" value="70" style="width:80px; padding:8px; border-radius:5px; border:1px solid #ccc;"> <span style="font-weight:bold;">km/h</span>
            </div>
            
            <div style="font-weight:bold; display:flex; justify-content:space-between; margin-bottom:10px;">
                <span>경유지 및 목적지 설정</span>
                <button type="button" class="btn-add" onclick="addWaypoint()">➕ 경유지 추가</button>
            </div>
            <div id="dest-inputs"></div>

            <select id="route-type" class="route-select">
                <option value="eco">🌿 에코 코스 + 교통상황 반영 (권장)</option>
                <option value="fast">🚀 최단 거리 코스 (교통상황 무시)</option>
            </select>

            <button class="btn-start" onclick="startNavigation()">경로 탐색 및 주행 시작</button>
        </div>
    </div>

    <div id="traffic-legend">
        <div class="leg-item"><div class="leg-color" style="background:#2ed573;"></div>원활 (설정속도)</div>
        <div class="leg-item"><div class="leg-color" style="background:#ffa502;"></div>서행 (40km/h)</div>
        <div class="leg-item"><div class="leg-color" style="background:#ff4757;"></div>정체 (15km/h)</div>
    </div>

    <div id="top-navi-panel">
        <div class="direction-box">
            <div class="turn-arrow" id="hud-arrow">⬆️</div>
            <div class="dist-text"><span id="hud-dist">0</span><span class="dist-unit" id="hud-unit">m</span></div>
        </div>
        <div class="road-name" id="hud-road">경로 탐색중...</div>
    </div>

    <div id="right-panel">
        <div class="speed-controls">
            <button class="speed-btn active" onclick="setSpeed(1, this)">1x</button>
            <button class="speed-btn" onclick="setSpeed(5, this)">5x</button>
            <button class="speed-btn" onclick="setSpeed(20, this)">20x</button>
            <button class="speed-btn" onclick="setSpeed(50, this)">50x</button>
        </div>
        <div class="eco-stats">
            <div style="color:#7f8fa6; font-size:12px; margin-bottom:5px;">누적 에코 성과</div>
            <div style="font-weight:bold;">🌱 탄소: <span class="eco-val" id="hud-co2">0.0</span> kg</div>
            <div style="font-weight:bold;">💰 절약: <span class="eco-val" id="hud-money">0</span> 원</div>
            <div class="eco-reference">
                * 비교 대상: 일반 내비게이션(최단거리 위주)<br>
                * 기준 연비 5.0km/L vs 에코 연비 6.5km/L<br>
                * 경유가 1,500원 기준 차액 산출
            </div>
        </div>
    </div>

    <div id="bottom-panel">
        <div class="info-block">
            <div class="info-val"><span id="hud-time">--:--</span></div>
            <div class="info-label">도착 예정</div>
        </div>
        <div class="info-block">
            <div class="info-val" style="color:#ff4757;"><span id="hud-min">0</span>분</div>
            <div class="info-label">소요 시간</div>
        </div>
        <div class="info-block" style="border-left: 1px solid #dcdde1; padding-left: 20px;">
            <div class="info-val" style="color:#2e86de;"><span id="hud-weight">0</span><span style="font-size:16px;">kg</span></div>
            <div class="info-label">현재 적재량</div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([35.5443, 129.2558], 17);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

        const coordsMap = { "울산대학교 정문": [129.2558, 35.5443], "현대자동차": [129.3785, 35.5352], "매곡산단": [129.3512, 35.6552], "길천산단": [129.1121, 35.5901], "온산공단": [129.3521, 35.4352], "석유화학단지": [129.3452, 35.4801], "테크노산단": [129.2812, 35.4652], "울산시청": [129.3114, 35.5383] };
        const defaultDests = [ {n: "현대자동차", w: 2000}, {n: "매곡산단", w: 1500}, {n: "길천산단", w: 2500}, {n: "온산공단", w: 3000}, {n: "석유화학단지", w: 2000}, {n: "테크노산단", w: 1500} ];

        const destContainer = document.getElementById('dest-inputs');
        let destCount = 0;

        function addWaypoint(name = "", weight = 0, isDefault = false) {
            destContainer.innerHTML += `<div class="input-row" id="row-${destCount}"><span style="font-size:12px; font-weight:bold; color:#7f8fa6;">${isDefault ? '도착' : '경유'}</span><input type="text" id="dest-name-${destCount}" value="${name}" placeholder="장소명"><input type="number" id="dest-weight-${destCount}" value="${weight}" placeholder="하차량(kg)"></div>`;
            destCount++;
        }
        defaultDests.forEach(d => addWaypoint(d.n, d.w, true));

        let truckMarker, arrowElement;
        let currentTotalWeight = 0;
        let simSpeed = 1;
        let baseKmh = 70; // 사용자 설정 기본 속도
        let isEcoMode = true;
        let accumulatedDist = 0;
        let trafficSegments = []; 

        function setSpeed(speed, btn) {
            simSpeed = speed;
            document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function startNavigation() {
            baseKmh = parseInt(document.getElementById('base-speed').value) || 70;
            isEcoMode = document.getElementById('route-type').value === 'eco';

            let waypoints = [[129.2558, 35.5443]]; 
            let destInfo = [];
            currentTotalWeight = 0;

            for(let i=0; i<destCount; i++){
                let nameEl = document.getElementById(`dest-name-${i}`);
                if(!nameEl || nameEl.value.trim() === "") continue;
                const name = nameEl.value;
                const weight = parseInt(document.getElementById(`dest-weight-${i}`).value) || 0;
                currentTotalWeight += weight;
                waypoints.push(coordsMap[name] || coordsMap["울산시청"]); 
                destInfo.push({name, weight});
            }

            const coordsStr = waypoints.map(c => `${c[0]},${c[1]}`).join(';');
            const url = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson&steps=true`;
            
            const res = await fetch(url);
            const data = await res.json();
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('top-navi-panel').style.display = 'block';
            document.getElementById('right-panel').style.display = 'flex';
            document.getElementById('bottom-panel').style.display = 'flex';
            document.getElementById('traffic-legend').style.display = 'block';

            const polyCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
            
            let chunkSize = Math.floor(polyCoords.length / 15);
            trafficSegments = [];
            for (let i = 0; i < polyCoords.length - 1; i += chunkSize) {
                let chunk = polyCoords.slice(i, i + chunkSize + 1);
                let rand = Math.random();
                let color, speedLimit;
                
                if(rand > 0.85) { color = '#ff4757'; speedLimit = 15; } 
                else if(rand > 0.65) { color = '#ffa502'; speedLimit = 40; } 
                else { color = '#2ed573'; speedLimit = baseKmh; } 

                if(!isEcoMode) { color = '#2e86de'; speedLimit = baseKmh; } 

                L.polyline(chunk, {color: color, weight: 8, opacity: 0.8}).addTo(map);
                for(let j=0; j<chunk.length; j++){ trafficSegments.push(speedLimit); }
            }

            const icon = L.divIcon({ html: '<div class="navi-arrow" id="arrow-icon"></div>', className: '', iconSize: [40, 50], iconAnchor: [20, 45] });
            truckMarker = L.marker(polyCoords[0], {icon: icon}).addTo(map);
            arrowElement = document.getElementById('arrow-icon');

            document.getElementById('hud-weight').innerText = currentTotalWeight.toLocaleString();
            runRealisticSimulation(data.routes[0], destInfo);
        }

        function getManeuverInfo(modifier, type) {
            if(type === 'arrive') return { txt: '목적지 도착', arrow: '🚩' };
            const m = modifier || '';
            if(m.includes('right')) return { txt: '우회전', arrow: '➡️' };
            if(m.includes('left')) return { txt: '좌회전', arrow: '⬅️' };
            if(m.includes('uturn')) return { txt: '유턴', arrow: '🔄' };
            return { txt: '직진', arrow: '⬆️' };
        }

        function runRealisticSimulation(routeData, destList) {
            let allCoords = routeData.geometry.coordinates.map(c => [c[1], c[0]]);
            let legs = routeData.legs;
            
            const tick_ms = 100;
            let currentCoordIdx = 0, currentLegIdx = 0, currentStepIdx = 0;
            let currentPos = L.latLng(allCoords[0]);
            let stepDistLeft = legs[0].steps[0].distance;
            
            let totalRemainDist = routeData.distance; 
            let alertShown = false; 

            const simTimer = setInterval(() => {
                let currentTrafficSpeed = trafficSegments[currentCoordIdx] || baseKmh; 
                let speed_ms = currentTrafficSpeed * (1000 / 3600); 

                let distToMove = speed_ms * (tick_ms / 1000) * simSpeed;
                accumulatedDist += distToMove;

                // 위치 이동
                while(distToMove > 0 && currentCoordIdx < allCoords.length - 1) {
                    let p1 = currentPos;
                    let p2 = L.latLng(allCoords[currentCoordIdx + 1]);
                    let distToNextPoint = p1.distanceTo(p2);

                    if(distToMove >= distToNextPoint) {
                        distToMove -= distToNextPoint;
                        currentCoordIdx++;
                        currentPos = L.latLng(allCoords[currentCoordIdx]);
                    } else {
                        let ratio = distToMove / distToNextPoint;
                        currentPos = L.latLng(p1.lat + (p2.lat - p1.lat) * ratio, p1.lng + (p2.lng - p1.lng) * ratio);
                        distToMove = 0;
                    }
                }

                truckMarker.setLatLng(currentPos);
                map.setView(currentPos, 17, {animate: false});

                // ★ 화살표 정확한 회전 (현재 위치에서 바로 다음 지점 바라보기)
                if(currentCoordIdx < allCoords.length - 1) {
                    let dy = allCoords[currentCoordIdx + 1][0] - currentPos.lat;
                    let dx = allCoords[currentCoordIdx + 1][1] - currentPos.lng;
                    let angle = Math.atan2(dx, dy) * 180 / Math.PI;
                    if(arrowElement) arrowElement.style.transform = `rotate(${angle}deg)`;
                }

                let movedDist = speed_ms * (tick_ms / 1000) * simSpeed;
                stepDistLeft -= movedDist;
                totalRemainDist -= movedDist;

                // 에코 성과
                if(isEcoMode) {
                    let kmDriven = accumulatedDist / 1000;
                    document.getElementById('hud-co2').innerText = (kmDriven * 0.15).toFixed(1);
                    document.getElementById('hud-money').innerText = Math.round(kmDriven * 120).toLocaleString();
                }

                // ★ TBT 알림 (초고속에서도 인식되도록 임계값 상향)
                let currentStep = legs[currentLegIdx] && legs[currentLegIdx].steps[currentStepIdx];
                if(currentStep && stepDistLeft > 0 && stepDistLeft <= 400 && !alertShown) {
                    let info = getManeuverInfo(currentStep.maneuver.modifier, currentStep.maneuver.type);
                    if(info.txt !== '직진' && info.txt !== '목적지 도착') {
                        let alertBox = document.getElementById('tbt-alert');
                        alertBox.innerText = `⚠️ 잠시 후 ${info.txt}입니다.`;
                        alertBox.style.opacity = 1;
                        alertShown = true;
                        // 50배속일 때는 팝업이 더 빨리 사라지게 처리
                        setTimeout(() => { alertBox.style.opacity = 0; }, Math.max(1000, 3000 / simSpeed)); 
                    }
                }

                // ★ 초고속 주행 스텝 처리 루프 (배속 때문에 스텝을 여러 개 넘을 경우를 대비한 while문)
                while(stepDistLeft <= 0 && currentLegIdx < legs.length) {
                    alertShown = false; 
                    currentStepIdx++;
                    
                    if(currentStepIdx >= legs[currentLegIdx].steps.length) { 
                        let currentDest = destList[currentLegIdx];
                        let dropWeight = currentDest.weight || 0;
                        currentTotalWeight -= dropWeight;
                        if(currentTotalWeight < 0) currentTotalWeight = 0;
                        document.getElementById('hud-weight').innerText = currentTotalWeight.toLocaleString();
                        
                        let toast = document.getElementById('arrival-toast');
                        document.getElementById('toast-title').innerText = `🚩 ${currentDest.name} 도착`;
                        document.getElementById('toast-desc').innerHTML = `하차: <span style="color:#f1c40f">${dropWeight}kg</span> / 남은적재량: ${currentTotalWeight}kg`;
                        toast.style.opacity = 1;
                        setTimeout(() => { toast.style.opacity = 0; }, 4000);
                        
                        currentLegIdx++;
                        currentStepIdx = 0;
                        
                        if(currentLegIdx >= legs.length) {
                            clearInterval(simTimer);
                            document.getElementById('hud-road').innerText = "안내를 종료합니다.";
                            document.getElementById('hud-arrow').innerText = "🏁";
                            return;
                        }
                    }
                    
                    // 넘친 거리(음수)를 다음 스텝 길이에 반영하여 정확도 유지
                    if (currentLegIdx < legs.length && legs[currentLegIdx].steps[currentStepIdx]) {
                        stepDistLeft += legs[currentLegIdx].steps[currentStepIdx].distance;
                    } else {
                        break;
                    }
                }

                // UI 텍스트 갱신
                if(currentLegIdx < legs.length && legs[currentLegIdx].steps[currentStepIdx]) {
                    let distShow = Math.max(0, stepDistLeft);
                    document.getElementById('hud-dist').innerText = distShow > 1000 ? (distShow/1000).toFixed(1) : distShow.toFixed(0);
                    document.getElementById('hud-unit').innerText = distShow > 1000 ? "km" : "m";
                    
                    let info = getManeuverInfo(legs[currentLegIdx].steps[currentStepIdx].maneuver.modifier, legs[currentLegIdx].steps[currentStepIdx].maneuver.type);
                    document.getElementById('hud-arrow').innerText = info.arrow;
                    document.getElementById('hud-road').innerText = `${info.txt} (${legs[currentLegIdx].steps[currentStepIdx].name || "일반 도로"})`;

                    let remainMin = Math.max(1, Math.ceil((totalRemainDist / 1000) / baseKmh * 60));
                    document.getElementById('hud-min').innerText = remainMin;
                    
                    let now = new Date();
                    now.setMinutes(now.getMinutes() + remainMin);
                    document.getElementById('hud-time').innerText = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
                }
            }, tick_ms);
        }
    </script>
</body>
</html>
